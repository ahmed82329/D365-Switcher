<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>D365 Switcher settings</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="options"><h1>D365 Company & Environment Switcher</h1><div class="muted">Configure the D365 locations and legal entities you are authorized to use.</div>
<div id="variantNote" class="note"></div>
<section><h2>Environments</h2><div class="card"><form id="environmentForm" class="form-grid"><input id="environmentName" type="text" maxlength="80" placeholder="Name, e.g. Production" required><input id="environmentUrl" type="url" placeholder="https://example.operations.dynamics.com/" required><button class="primary" type="submit" id="saveEnvironment">Add</button><input type="hidden" id="environmentEditIndex" value=""></form><table class="list"><thead><tr><th>Name</th><th>URL</th><th class="compact">Actions</th></tr></thead><tbody id="environmentRows"></tbody></table></div></section>
<section><h2>Companies / legal entities</h2><div class="card"><form id="companyForm" class="form-grid company-grid"><input id="companyCode" type="text" maxlength="20" placeholder="Code, e.g. USMF" required><input id="companyDescription" type="text" maxlength="80" placeholder="Description" required><button class="primary" type="submit" id="saveCompany">Add</button><input type="hidden" id="companyEditIndex" value=""></form><table class="list"><thead><tr><th>Code</th><th>Description</th><th class="compact">Actions</th></tr></thead><tbody id="companyRows"></tbody></table></div></section>
<div class="toolbar"><button id="exportConfig">Export configuration</button><label><button id="importButton" type="button">Import configuration</button><input id="importFile" class="hidden" type="file" accept="application/json,.json"></label><button id="restoreDefaults">Restore defaults</button></div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div class="copyright">Copyright © 2026 Ahmed Imam. All Rights Reserved. Independent software; not affiliated with Microsoft.</div></main><script src="config.js"></script><script src="options.js"></script></body></html>
